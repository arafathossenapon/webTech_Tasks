<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Validation</title>
    <script src ="formVal.js" defer ></script>
</head>

<body>
    <form id="myForm">

        <label for="name">Name:</label>
        <input type="text" id="name" name="name" placeholder="enter your name"><br>
        <span id="nameErr" style="color: red;"></span> <br>

        <label for="age">Age:</label>
        <input type="number" id="age" name="age" placeholder="Enter age"> <br>
        <span id="ageErr" style="color: red;"></span> <br>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="enter email"> <br>
        <span id="emailErr" style="color: red;"></span> <br>

        <label for="pass">Password: </label>
        <input type="password" id="pass" name="pass" placeholder="Enter Your Password"><br>
        <span id="passErr" style="color: red;">
        </span><br>

        <label for="conPass">Confirm Password: </label>
        <input type="password" id="conPass" name="conPass" placeholder="Enter Your Password again"><br>
        <span id="conPassErr" style="color: red;">
        </span><br>

        <label for="gender">Gender:</label>
        <input type="radio" id="male" name="gender" value="male">Male
        <input type="radio" id="female" name="gender" value="female">Female
        <br> <span id="genderErr" style="color: red;"></span> <br>

        <label for="fabSports">Fab. Sports: </label>
        <input type="checkbox" id="cricket" name="fabSports" value="cricket">cricket
        <input type="checkbox" id="football" name="fabSports" value="football">football
        <br>
        <span id="fabSportsErr" style="color: red;">
        </span><br>

        <label for="country"> COuntry</label>
        <select id="country" name="country">
            <option value ="USA" id="usa">USA </option>
            <option value ="UK" id="uk">UK </option>
            <option value="bn" id="bn">Bangladesh</option>
        </select> <br>
        <span id="countryErr" style="color: red;">
        </span><br>

        <!-- <label for="proPic">Profile Pic:</label>
        <input type="file" id="proPic" name="proPic">
        <span id="proPicErr" style="color: red;">
        </span><br> -->

        <input type="submit" id="submit" value="submit" name="submit">
        
        <br> <br>
        <span id="success" style="color: green;">
        </span><br>

    </form>
</body>

</html>
