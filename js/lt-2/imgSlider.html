<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>image slider</title>
    <style> 
    body{
        text-align: center;
    }
    img{
        width: 500px;
        height: 650px;
        border: 2px solid blue;
        border-radius: 20px;
        outline: 5px solid lime;

    }
    button{
            padding:10px 20px;
            margin:20px;
            font-size:18px;
        }

    </style>
    <script src="imgslider.js" defer></script>
</head>
<body>
    <h1>Image slider</h1>
    <img id="slider" src="images/1.JPG" alt="">
    <div>
        <button onclick="prevImg()">Previous picture</button>
        <button onclick="nextImg()">Next picture</button>
    </div>
    
</body>
</html>
