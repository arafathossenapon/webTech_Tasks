<!DOCTYPE html>
<html>

<head>

    <title>Dark Light Mode</title>
    <script src="darkLight.js"></script>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin: 0;
        }

        header {
            padding: 20px;
            border: 2px solid black;
            margin: 100px 10px 10px 10px;
        }

        section,
        footer {

            padding: 20px;
            border: 2px solid black;
            margin: 10px;

        }

        button {

            padding: 10px 20px;
            margin: 20px;
            position: absolute;
            top: 20px;
            right: 20px;


        }
    </style>

</head>

<body>

    <header id="header">

        <h2>My Portfolio</h2>

    </header>

    <section id="content">

        <p>
            Welcome to my portfolio website.
        </p>

    </section>

    <footer id="footer">

        Copyright 2026

    </footer>

    <button id="themeBtn" onclick="changeTheme()">

        Switch to Dark Mode

    </button>

</body>

</html>
