<!DOCTYPE html>
<html>

<head>

    <title>Editable Table</title>


    <style>
        body {
            font-family: Arial;
            text-align: center;
        }

        input {
            padding: 8px;
            margin: 5px;
        }

        button {
            padding: 8px 15px;
        }

        table {
            width: 70%;
            margin: 20px auto;
            border-collapse: collapse;
        }

        table,
        th,
        td {
            border: 1px solid black;
        }

        th,
        td {
            padding: 10px;
        }
    </style>

    <script src="editableTable.js" defer></script>

</head>

<body>

    <h2>Student Management System</h2>

    <input type="text" id="name" placeholder="Name"> <br>

    <input type="text" id="roll" placeholder="Roll"> <br>

    <input type="text" id="department" placeholder="Department"> <br>

    <button onclick="addStudent()">

        Add Student

    </button>

    <p id="error" style="color:red;"></p>

    <table id="studentTable">

        <tr>

            <th>Name</th>

            <th>Roll</th>

            <th>Department</th>

            <th>Action</th>

        </tr>

        

    </table>

</body>

</html>
