<!DOCTYPE html>
<html>

<head>
    <title>Task-6</title>
    <style>
        body{
            background-color: #ddd;
            text-align: center;
        }
        .user-card{
            width: 300px;
            height: 300px;
            position: relative;
            background-color: white;
            border: 2px solid blue;
            border-radius: 12px;
            padding: 15px;
            margin: 50px auto;

        }

        .user-card img{
            width: 200px;
            border-radius: 50%;
        }
        .badge-online{
            background-color: green;
            position: absolute;
            top: 10px;
            right: 20px;
            padding: 5px;
            border-radius: 10px;
            color: white;


        }
    </style>
</head>

<body>
    <div class="user-card">
        <img src="../img/F.jpg" alt="">
        <h3>MR PARROT</h3>
        <p>I am a parrot</p>
        <div class="badge-online">Online</div>
    </div>
</body>

</html>
