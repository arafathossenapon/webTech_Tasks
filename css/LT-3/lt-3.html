<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation Bar</title>

    <style>

        body{
            margin:0;
            font-family: Arial, sans-serif;
        }

        nav{
            background-color: navy;
            padding:15px;
            width:100%;
        }

        nav a{
            display:inline-block;
            color:white;
            text-decoration:none;
            padding:10px 20px;
            margin:0 10px;
        }

        nav a:hover{
            background-color:orange;
            color:black;
        }

    </style>

</head>
<body>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Gallery</a>
        <a href="#">Contact</a>
    </nav>

</body>
</html>
