<!DOCTYPE html>
<html lang="en">
<head>
    <title>Product Information Box</title>
    <style>

        body{
            
            background-color: #f2f2f2;
            text-align: center;
        }

        .product{
            display: inline-block;
            width: 250px;
            margin: 20px;
            padding: 20px;
            border: 2px solid black;
            background-color: white;
            text-align: center;
        }

        .product img{
            width: 120px;
            height: 120px;
        }

        .product h2{
            margin: 10px 0;
        }

        .product p{
            font-size: 15px;
        }

        .product a{
            text-decoration: none;
            color: blue;
            font-weight: bold;
        }

        .product:hover{
            outline: 5px solid blue ;
            outline-offset: 10px;
        }

    </style>

</head>
<body>

    <div class="product">

        <img src="https://png.pngtree.com/png-vector/20250522/ourmid/pngtree-modern-laptop-computer-with-screen-open-technology-digital-device-png-image_16345445.png" alt="Laptop">

        <h2>Laptop</h2>

        <p>High-performance laptop for work and study.</p>

        <h3>$900</h3>

        <a href="#">Buy Now</a>

    </div>

    <div class="product">

        <img src="https://gadgetnmusic.com/wp-content/uploads/2024/06/Awei-AT7-Bluetooth-Headphone-1.jpg" alt="Headphones">

        <h2>Headphones</h2>

        <p>Noise-cancelling wireless headphones.</p>

        <h3>$150</h3>

        <a href="#">Buy Now</a>

    </div>

    <div class="product">

        <img src="https://gadgetnmusic.com/wp-content/uploads/2024/01/Oraimo-OSW-42-Watch-ER-1.43-AMOLED-Calling-Smart-Watch-12.jpg" alt="Smartwatch">

        <h2>Smartwatch</h2>

        <p>Track your fitness and notifications.</p>

        <h3>$250</h3>

        <a href="#">Buy Now</a>

    </div>

</body>
</html>
